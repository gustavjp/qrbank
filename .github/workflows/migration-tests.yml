name: Backend PostgreSQL tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/migration-tests.yml"

jobs:
  postgres-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qrbank
          POSTGRES_PASSWORD: qrbank
          POSTGRES_DB: qrbank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrbank -d qrbank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QRBANK_DATABASE_URL: postgresql+psycopg://qrbank:qrbank@127.0.0.1:5432/qrbank_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall app migrations tests
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Development downgrade to base
        run: alembic downgrade base
      - name: Upgrade to head again
        run: alembic upgrade head
      - name: Run test suite
        run: pytest
