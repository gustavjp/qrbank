{% extends "base.html" %}
{% block title %}Sign in · QRBank{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if verified %}<p class="success">Email verified. You can sign in now.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/auth/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Email
    <input type="email" name="email" required autocomplete="email" value="{{ email or '' }}">
  </label>
  <label>Password
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button class="primary" type="submit">Sign in</button>
</form>
<p class="links"><a href="/auth/register">Create an account</a> · <a href="/auth/check-email">Resend verification email</a></p>
{% endblock %}
