<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QRBank{% endblock %}</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { margin: 0; background: #f5f7fa; color: #17202a; }
    main { max-width: 34rem; margin: 4rem auto; padding: 0 1rem; }
    .card { background: white; border: 1px solid #dfe5ec; border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 28px rgba(0,0,0,.06); }
    h1 { margin-top: 0; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    input, select { box-sizing: border-box; width: 100%; padding: .7rem .8rem; margin-top: .35rem; border: 1px solid #b9c3cf; border-radius: 8px; font: inherit; }
    button { margin-top: 1.25rem; padding: .7rem 1rem; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
    .primary { background: #1f5eff; color: white; }
    .secondary { background: #e9eef5; color: #17202a; }
    .error { background: #fff1f0; border: 1px solid #ffc7c2; padding: .75rem; border-radius: 8px; }
    .success { background: #eefbf1; border: 1px solid #b8e6c0; padding: .75rem; border-radius: 8px; }
    .muted { color: #596675; }
    .links { margin-top: 1rem; }
    a { color: #174fc7; }
  </style>
</head>
<body>
<main>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</main>
{% block page_footer %}{% endblock %}
</body>
</html>
