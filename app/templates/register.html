{% extends "base.html" %}
{% block title %}Create account · QRBank{% endblock %}
{% block content %}
<h1>Create teacher account</h1>
<p class="muted">Use an email address you can verify.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/auth/register">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Email
    <input type="email" name="email" required autocomplete="email" value="{{ email or '' }}">
  </label>
  <label>Password
    <input type="password" name="password" required minlength="12" autocomplete="new-password">
  </label>
  <label>Confirm password
    <input type="password" name="password_confirm" required minlength="12" autocomplete="new-password">
  </label>
  <button class="primary" type="submit">Create account</button>
</form>
<p class="links">Already registered? <a href="/auth/login">Sign in</a>.</p>
{% endblock %}
