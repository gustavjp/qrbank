{% extends "base.html" %}
{% block title %}Choose new password · QRBank{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/auth/reset-password">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="token" value="{{ reset_token }}">
  <label>New password (at least 12 characters)
    <input type="password" name="password" required minlength="12" autocomplete="new-password">
  </label>
  <label>Confirm new password
    <input type="password" name="password_confirm" required minlength="12" autocomplete="new-password">
  </label>
  <button class="primary" type="submit">Reset password</button>
</form>
<p class="links"><a href="/auth/forgot-password">Request another link</a></p>
{% endblock %}
